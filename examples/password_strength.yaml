# A security-flavoured example — exercises the security-review gate on validator
# logic. Run with:
#   codeswarm build --spec examples/password_strength.yaml            # BytePlus
#   codeswarm build --spec examples/password_strength.yaml --dry-run  # offline

name: password-strength

idea: >
  A pure-Python password-strength library (standard library only, no third-party
  packages) exposing a single evaluate(password) API. Requirements:
  - A configurable minimum-length rule (default 8).
  - Character-class checks: has lowercase, has uppercase, has digit, has symbol.
  - Rejection of passwords present in a small built-in common-passwords set
    (e.g. "password", "123456", "qwerty", "letmein", "admin").
  - A 0-100 strength score derived from the satisfied rules, plus a label of
    "weak", "fair", or "strong".
  - evaluate(password) returns a result with the score, label, and the list of
    failed rule names.
  - Empty input or non-string input raises ValueError.
